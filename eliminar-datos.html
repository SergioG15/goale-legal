<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- El <title> y el <html lang> reales los pone legal-render.js segun el idioma
     del lector; estos son solo el valor por defecto si el JS no llegara a correr. -->
<title>GOALE</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    line-height: 1.6;
    color: #e6ece8;
    background: #101a16;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; color: #7fe0a0; }
  h2 { font-size: 1.15rem; margin-top: 2.2em; border-bottom: 2px solid #22322a; padding-bottom: 6px; }
  .updated { color: #8fa398; font-size: 0.85rem; margin-bottom: 2em; }
  a { color: #7fe0a0; }
  code { background: #1a2a22; padding: 1px 5px; border-radius: 4px; }
  ul { padding-left: 1.3em; }
  .contact-box {
    background: #17241e;
    border: 1px solid #2c3f35;
    border-radius: 8px;
    padding: 16px 20px;
    margin-top: 2em;
  }
  .lang-bar {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 24px; padding-bottom: 14px; border-bottom: 1px solid #22322a;
    font-size: 0.9rem; color: #8fa398;
  }
  .lang-bar select {
    font: inherit; padding: 5px 8px; border: 1px solid #2c3f35;
    border-radius: 6px; background: #17241e; color: #e6ece8;
  }
  .prevails {
    margin-top: 2.4em; padding-top: 14px; border-top: 1px solid #22322a;
    font-size: 0.85rem; color: #8fa398;
  }
</style>
</head>
<body>
<!-- El contenido se pinta desde legal-i18n.js (los 12 idiomas) para que un
     jugador sueco, coreano o japones no reciba un texto legal en espanol. -->
<script type="module">
  import { ERASE } from "./legal-i18n.js";
  import { renderErase } from "./legal-render.js";
  renderErase(ERASE);
</script>
</body>
</html>
